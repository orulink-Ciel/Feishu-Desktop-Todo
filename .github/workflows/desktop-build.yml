name: Desktop preview packages

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      FEISHU_TODO_PUBLIC_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run prepare:cli
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: npm run package:public -- --target ${{ matrix.target }}
      - run: npm run collect:release -- ${{ matrix.target }}
      - name: Check installed Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "release/${{ matrix.target }}" -Filter '*-setup.exe' | Select-Object -First 1
          $installedDir = Join-Path $env:RUNNER_TEMP 'FeishuTodoPreview'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installedDir" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Installer failed.' }
          $env:FEISHU_TODO_CLI = Join-Path $env:RUNNER_TEMP 'nonexistent-cli.exe'
          $result = & (Join-Path $installedDir 'feishu-desktop-todo.exe') --check-runtime | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$result.ok -or $result.dutyConfigured) { throw 'Installed runtime check failed.' }
          $result | ConvertTo-Json | Set-Content "release/${{ matrix.target }}/installed-runtime.json"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: release/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
